name: Selftest
# The template proves itself: the full red-team (26 attacks, 0 may land)
# runs weekly and on demand. Kept off the per-push path so the wall stays
# fast; the watchman and this together mean drift can't hide for long.

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the red-team (26 attacks)
        run: bash tests/redteam.sh
