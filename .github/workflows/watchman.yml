name: Watchman
# The deterministic watchman: daily rounds, no AI, one report issue.
# The rounds themselves are described in WATCHMAN.md.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Do the rounds
        run: |
          : > /tmp/problems.md
          for c in checks/*.sh; do
            if ! out=$(sh "$c" --all 2>&1); then
              {
                echo "### Law broken: \`$c\`"
                echo '```'
                echo "$out" | head -5
                echo '```'
              } >> /tmp/problems.md
            fi
          done
          if ! sha256sum -c MANIFEST.sha256 >/dev/null 2>&1; then
            echo "### Machinery changed without a manifest update (MANIFEST.sha256 mismatch)." >> /tmp/problems.md
          fi
          last_day=$(git log -1 --format=%ad --date=format:%Y-%m-%d)
          if [ ! -f "register/$last_day.md" ]; then
            echo "### No register day-file for the last commit day ($last_day) — work happened off the record." >> /tmp/problems.md
          fi
          if [ -f register/PENDING_OPERATOR.md ] && \
             awk '/^## Open/{f=1;next}/^## /{f=0}f' register/PENDING_OPERATOR.md | grep -q '[^[:space:]]'; then
            echo "### Questions are waiting under '## Open' in register/PENDING_OPERATOR.md." >> /tmp/problems.md
          fi

      - name: Report (open, update, or close the single Watchman issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Watchman report"
          existing=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -s /tmp/problems.md ]; then
            {
              echo "The watchman found problems on today's rounds. Report, never repair — a human decides."
              echo
              cat /tmp/problems.md
            } > /tmp/body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file /tmp/body.md
            else
              gh issue create --title "$title" --body-file /tmp/body.md
            fi
            exit 1
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "All clear on today's rounds."
            fi
            echo "All clear."
          fi
